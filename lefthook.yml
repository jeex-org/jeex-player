# Git hooks, installed by `bun install` (skipped when `CI` is set) and
# reinstalled by `bun run hooks:install`. The full quality gate stays
# `scripts/check.sh`; the hook only runs what has to hold for every single
# commit.
pre-commit:
  commands:
    no-docs-refs:
      run: bash scripts/no-docs-refs.sh --staged
