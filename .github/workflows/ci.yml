# The fast half of the quality gate, run on a machine nobody owns, on every
# push to `main` and every pull request.
#
# It runs every step of `scripts/check.sh`'s full tier that needs no browser,
# in one job of about a minute and a half. The browser levels (the Vitest
# browser tier, its DOM-layer floors and the Playwright e2e suite) are not
# here: on a hosted runner (4 vCPUs, no GPU, SwiftShader) they cost about
# twenty minutes of wall time across sixteen runners, against minutes on a
# developer machine. They run in the local gate (`bash scripts/check.sh`),
# which is the proof a change is ready, and on demand in `browser.yml`
# (Actions, "Browser tests", "Run workflow").
#
# Together the two workflows run the step list of `scripts/check.sh`, with two
# documented differences (`scripts/ci-parity.test.ts` proves no other one
# appears):
#
#  1. `code-ranker` is an optional structural lint a contributor installs
#     globally (`npm i -g code-ranker`). `check.sh` runs it when it is
#     installed and skips it otherwise; CI does not install it, so it has no
#     step here.
#  2. The Chromium the two browser levels drive is already on a developer's
#     machine (`bunx playwright install chromium`, once), so `check.sh` just
#     runs the tests. `browser.yml` has to fetch and cache it first, which is
#     the four `playwright` steps of `.github/actions/setup`
#     (`browser: 'true'`); they install nothing the gate itself checks.
#
# Every step calls the SAME command or script as `check.sh`
# (`scripts/console-policy.sh`, `scripts/schema-gate.sh` where `check.sh`
# extracted one), so the two lists cannot drift apart silently.
#
# `bun audit` runs here AND in `check.sh`: a dependency advisory published
# after a developer's last local run is exactly what the weekly scheduled run
# is for. The schedule triggers only this workflow, never the browser one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A vulnerability can appear in a dependency of a commit that never changes.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The job takes about a minute and a half; ten minutes leaves room for a
    # cold package cache and a slow runner without letting a hang run long.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: typecheck (src, dev, vite.config.ts)
        run: bun run typecheck

      - name: typecheck (scripts, vite configs)
        run: bun run typecheck:scripts

      - name: lint
        run: bun run lint

      - name: format
        run: bun run format:check

      - name: test with coverage
        run: bun run test

      - name: per-layer coverage floors
        run: bun run check:coverage

      - name: console policy (src/)
        run: bash scripts/console-policy.sh

      - name: listener policy (signal)
        run: bun run scripts/listener-policy.ts src

      - name: build (demo)
        run: bun run build

      - name: budget (demo)
        run: bun run check:budget

      - name: build (site)
        run: bun run scripts/site-build.ts

      - name: build (library)
        run: bun run build:lib

      - name: budget (library)
        run: bun run check:budget:lib

      - name: module size
        run: bun run scripts/size-check.ts src

      - name: source hygiene (spelling, headers)
        run: bun run scripts/spelling-check.ts src

      - name: layer policy and cycles
        run: bun run check:arch

      - name: dead code
        run: bun run check:dead

      - name: 'schema: generate-to-tmp + check'
        run: bash scripts/schema-gate.sh

      - name: package (publint, attw)
        run: bun run check:pkg

      - name: dependency audit
        run: bun audit
