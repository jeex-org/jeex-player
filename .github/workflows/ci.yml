# The quality gate, run on a machine nobody owns.
#
# The step list below is the step list of `scripts/check.sh`, with two
# documented differences (`scripts/ci-parity.test.ts` proves no other one
# appears):
#
#  1. `code-ranker` is an optional structural lint a contributor installs
#     globally (`npm i -g code-ranker`). `check.sh` runs it when it is
#     installed and skips it otherwise; CI does not install it, so it has no
#     step here.
#  2. The Chromium the two browser levels drive is already on a developer's
#     machine (`bunx playwright install chromium`, once), so `check.sh` just
#     runs the tests. Here it has to be fetched and cached first, which is the
#     four `playwright` steps of `.github/actions/setup` (`browser: 'true'`)
#     — they install nothing the gate itself checks.
#
# Every other step — both type checks, lint, format, the three test levels
# with their two coverage floors, the console and listener policies, the two
# builds, the two budgets, module size, source hygiene, the layer policy, dead
# code, the schema gate, the two packaging checks and the audit — runs in both
# places, calling the SAME script where `check.sh` extracted one
# (`scripts/console-policy.sh`, `scripts/schema-gate.sh`), so the two lists
# cannot drift apart silently.
#
# The layout differs from `check.sh`'s single sequence, and only in WHERE a
# step runs, never in what it checks (`scripts/ci-parity.test.ts` proves the
# step list still matches):
#
#  - `check` runs every step that needs no browser, in one job.
#  - `component` runs the Vitest browser level split across eight runners
#    (`--shard=<i>/8`). On a hosted runner (4 vCPUs, no GPU, SwiftShader) the
#    whole tier costs about 20 minutes in one job, against about 6 minutes on
#    a 16-thread developer machine, and the software rasteriser is the
#    bottleneck: more Vitest workers on the same 4 vCPUs do not shorten the
#    run, they only slow every test against its own timeout. Eight runners
#    with one worker each keep every test near its developer-machine pace.
#    `tests/component-shards.ts` balances the shards by measured cost.
#  - `component-coverage` merges the eight shards' blob reports, coverage
#    included, into the `coverage-component/lcov.info` one local run writes,
#    and runs the DOM-layer floors on it: a floor checked per shard would
#    measure an eighth of the tests.
#  - `e2e` runs Playwright split the same way (`--shard=<i>/8`), one worker
#    per runner and three times the developer machine's budgets
#    (`JEEX_E2E_TIME_SCALE`, `playwright.config.ts`): a frame of the demo
#    apartment costs about a second on SwiftShader, and every Playwright
#    round trip waits for it.
#
# Screenshot comparisons in the e2e level run only locally; with `CI` set they
# are skipped, because the baselines are rendered on the maintainers' machines.
#
# `bun audit` runs here AND in `check.sh`: a dependency advisory published
# after a developer's last local run is exactly what a scheduled CI run is for.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A vulnerability can appear in a dependency of a commit that never changes.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup

      - name: typecheck (src, dev, vite.config.ts)
        run: bun run typecheck

      - name: typecheck (scripts, vite configs)
        run: bun run typecheck:scripts

      - name: lint
        run: bun run lint

      - name: format
        run: bun run format:check

      - name: test with coverage
        run: bun run test

      - name: per-layer coverage floors
        run: bun run check:coverage

      - name: console policy (src/)
        run: bash scripts/console-policy.sh

      - name: listener policy (signal)
        run: bun run scripts/listener-policy.ts src

      - name: build (demo)
        run: bun run build

      - name: budget (demo)
        run: bun run check:budget

      - name: build (library)
        run: bun run build:lib

      - name: budget (library)
        run: bun run check:budget:lib

      - name: module size
        run: bun run scripts/size-check.ts src

      - name: source hygiene (spelling, headers)
        run: bun run scripts/spelling-check.ts src

      - name: layer policy and cycles
        run: bun run check:arch

      - name: dead code
        run: bun run check:dead

      - name: 'schema: generate-to-tmp + check'
        run: bash scripts/schema-gate.sh

      - name: package (publint, attw)
        run: bun run check:pkg

      - name: dependency audit
        run: bun audit

  component:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every shard reports, so one red file does not hide a second one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup
        with:
          browser: 'true'

      # One worker, not the four `vitest.config.ts` pins for a developer
      # machine: on 4 vCPUs the shared software rasteriser is the bottleneck,
      # and every further page only stretches each test (measured on four
      # hardware threads: 759 s with four workers, 817 s with two, but the
      # slowest test of a file halves). With two workers on four shards, two
      # tests that sit near their budgets (a click in 360 that opens no panel,
      # the glide to the first tour camera) ran 5 s past them on the runner;
      # one worker gives each test the whole runner.
      #
      # The ceiling replaces the watchdog's 10-minute default
      # (`scripts/run-component-tests.ts`), which is sized for the whole tier
      # on a developer machine. With two workers the four shards took 6 to 10
      # minutes on the runner; eight shards with one worker each should take
      # about as long, and 15 leaves room for a slow runner.
      - name: component tests (Vitest browser mode) shard ${{ matrix.shard }}/8
        env:
          JEEX_COMPONENT_TIMEOUT_MS: '900000'
        run: >-
          bun run test:component
          --shard=${{ matrix.shard }}/8
          --maxWorkers=1
          --reporter=default
          --reporter=blob
          --outputFile.blob=component-blobs/blob-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: component-blob-${{ matrix.shard }}
          path: component-blobs/
          retention-days: 1

  component-coverage:
    needs: component
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: component-blob-*
          path: component-blobs
          merge-multiple: true

      # Runs no test and launches no browser: it replays the eight blobs and
      # writes the merged `coverage-component/lcov.info` the floors read.
      - name: merge the component shards (coverage included)
        run: bunx vitest run --config vitest.config.ts --merge-reports=component-blobs

      - name: DOM-layer coverage floors
        run: bun run check:coverage:component

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup
        with:
          browser: 'true'

      # `--reporter=github` is not passed here: `playwright.config.ts` picks
      # the GitHub reporter itself when `CI` is set, so a local run and this
      # one differ in exactly one place rather than two.
      # One worker and three times the budgets (`playwright.config.ts`,
      # `JEEX_E2E_TIME_SCALE`). Measured on three hardware threads (about a
      # hosted runner's pace) over one quarter of the suite: two workers and
      # the plain budgets failed 15 of 21 specs on the runner; one worker and
      # three times the budgets passed 20 of 21 in 23 minutes, and the 21st
      # (a hover that raced the control bar's idle timer) is fixed in its
      # spec. Eight shards keep each job near 12 minutes.
      - name: e2e tests (Playwright) shard ${{ matrix.shard }}/8
        env:
          JEEX_E2E_WORKERS: '1'
          JEEX_E2E_TIME_SCALE: '3'
        run: bun run test:e2e --shard=${{ matrix.shard }}/8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # The traces, the failure screenshots and the axe reports; only when
        # something failed, because they are large and useless when it did not.
        if: failure()
        with:
          name: playwright-artifacts-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
