<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JEEX dev — a baked project beside a bare scene</title>
    <style>
      /*
        Two boxes with a height, which is the whole contract. The page is not
        under test; `tests/e2e/project.spec.ts` drives it.
      */
      body {
        margin: 0;
        padding: 16px;
        background: #0d1111;
        color: #dfe7e7;
        font:
          13px/1.5 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 600;
      }
      .stages {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .stage {
        position: relative;
        block-size: 420px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
      }
      .stage-label {
        margin: 0 0 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(223, 231, 231, 0.65);
      }
      @media (max-width: 720px) {
        .stages {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>A baked project beside a bare scene</h1>

    <div class="stages">
      <div>
        <p class="stage-label">Left · <code>scene.url</code> on a bake · owns the page globals</p>
        <div class="stage" id="stage-project"></div>
      </div>
      <div>
        <p class="stage-label">Right · <code>scene.document</code>, no library · shipped catalogue</p>
        <div class="stage" id="stage-bare"></div>
      </div>
    </div>

    <script type="module" src="/dev/project-two.ts"></script>
  </body>
</html>
