<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JEEX embed — iframe and postMessage</title>
    <style>
      /*
        The host page downloads `embed/host.ts` and nothing else: no Three.js,
        no viewer, no stylesheet of the component. Everything on screen inside
        the frame belongs to the other document.
      */
      body {
        margin: 0;
        padding: 20px;
        background: #101615;
        color: #e9e1d4;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 16px;
        max-inline-size: 720px;
        color: rgba(233, 225, 212, 0.6);
        font-size: 12px;
        line-height: 1.55;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-block-end: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        padding: 7px 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        color: inherit;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #stage {
        position: relative;
        block-size: 460px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
      }
      #log {
        margin-block-start: 12px;
        font-size: 11px;
        /* 0.45 measured 3.75:1 on #101615, under the 4.5:1 AA
         minimum for normal text; 0.6 (the same alpha the page's own `p`
         already uses) measures 5.71:1. */
        color: rgba(233, 225, 212, 0.6);
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <h1>Viewer in an iframe</h1>
    <p>
      The host helper creates the frame, appends <code>?host=</code> and the options, queues commands until the frame reports
      <code>ready</code>, and answers only the origin it was given. The frame ignores everything else — including a well-formed message from
      a stranger.
    </p>

    <div class="row">
      <button id="play" type="button">play</button>
      <button id="pause" type="button">pause</button>
      <button id="progress" type="button">progress()</button>
      <button id="walk" type="button">setMode("walk")</button>
      <button id="dispose" type="button">dispose</button>
    </div>

    <div id="stage"></div>

    <div id="log">events: <span id="events"></span></div>

    <script type="module" src="/dev/embed-iframe.ts"></script>
  </body>
</html>
